# DAgger with VIG and flow-loss query scores on OpenDrawer (Isaac Lab): open the top drawer, put the charger in,
# close the drawer. Every value not given here takes the default in src/vig_dagger/config.py; any value can be
# overridden on the command line: vig-dagger run -c configs/opendrawer.yaml --set dagger.num_demos=200

name: opendrawer_v1                      # experiment name: W&B group and run-name prefix
work_dir: /path/to/outputs/opendrawer_v1 # every output of the experiment (~120 GB, see README)

resources:                               # the queue starts a job when the machine has room for it
  gpus: auto                             # every GPU nvidia-smi lists, or a list of indices
  sim_slots: auto                        # CPU budget in simulator jobs (~1.5 cores each); auto: CPU cores / 3
  max_load: auto                         # start nothing new above this 1-minute load average; auto: CPU cores
  train_gpu_memory_gb: 8                 # free GPU memory a training needs (uses ~3 GB; one of ours per GPU)
  sim_gpu_memory_gb: 6                   # free GPU memory a simulator job needs (Isaac renderer + policy: ~5 GB)
  dataloader_workers: 16                 # data-loading processes per training

isaac:
  python: auto                           # the Isaac environment (bash scripts/install_isaac.sh): <repo>/.venv-isaac/bin/python

wandb:                                   # optional; results always go to <work_dir>/results (REPORT.md, JSON, CSV, figures)
  enabled: false                         # true: also log to W&B (needs `wandb login` and membership in the entity)
  entity: vig-dagger-exp
  project: opendrawer

# ---- part 1: planner demos, collected by the motion planner in Isaac Sim
demos:
  source: collect                        # collect | download (hub.dataset_repo)
  num_demos: 100                         # the original training set ("base"); + dagger.num_demos extra for the baseline
  demos_per_part: 25                     # demos per collection job
  max_episode_steps: 1200

# ---- every training of the task (the MoE driver, dense full-resolution policies, per-resolution drivers)
training:
  epochs: 150

# ---- rounds: who drives DAgger and where VIG's samples come from
rounds: [moe, per_resolution]            # in order; round 2 starts after round 1's retraining
drivers:
  moe:
    source: train                        # the 7-level MoE, trained here on the 100 base demos
    factors: [1, 2, 4, 8, 16, 32, 64]
  per_resolution:
    factors: [1, 2, 4, 8, 16, 32, 64]    # 1 = the base retraining of seed 0; 2 ... 64 are trained for this round

thresholds:                              # demo frames the score percentiles are computed on
  num_demos: 50
  frame_stride: 4

# ---- part 3: DAgger (always both scorers)
dagger:
  num_demos: 100                         # successful DAgger episodes per scorer and round
  thresholds:                            # "p<q>" = q-th percentile of the score on the demo frames, or a number
    vig: {take: p95, return: p50}
    flow: {take: p95, return: p50}
  take_count: 2                          # consecutive steps above the take threshold before the expert takes over
  return_count: 16                       # consecutive steps below the return threshold before the policy takes back
  expert: demo                           # the expert moves like the planner demos (and corrects in place)
  max_episode_steps: 1200
  seed_start: 1000000

# ---- part 4: retraining (dense full-resolution policies) and evaluation
retrain:
  seeds: [0, 1, 2]
  planner_baseline: true                 # also train on base + 100 extra planner demos

evaluation:                              # every evaluated policy: 200 rollouts on the same scenes
  seed_start: 60000
  num_episodes: 200
  max_episode_steps: 1200
  evaluate_drivers: true                 # also the driving policies: the MoE and round 2's res2 ... res64 (own level)
  driver_all_levels: true                # the MoE at each of its 7 levels
