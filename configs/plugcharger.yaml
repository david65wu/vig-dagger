# DAgger collections on PlugCharger (ManiSkill, moving socket, 4 mm clearance) driven by three 7-level resolution MoEs
# that differ only in their training seed: 3 MoE seeds x {VIG, flow loss} x {p90, p95, p99} x {plain, random move}
# = 36 collections of 500 successful episodes each.
# Every value not given here takes the default in src/vig_dagger/config.py; any value can be overridden on the
# command line: vig-dagger run -c configs/plugcharger.yaml --set dagger.num_demos=200

name: plugcharger_moe_seeds              # experiment name: W&B group and run-name prefix
work_dir: /path/to/outputs/plugcharger_moe_seeds  # every output of the experiment (~580 GB on one machine, see README)

resources:                               # the queue starts a job when the machine has room for it
  gpus: auto                             # every GPU nvidia-smi lists, or a list of indices
  sim_slots: auto                        # CPU budget in simulator jobs (~1 core each); auto: CPU cores / 2
  max_load: auto                         # start nothing new above this 1-minute load average; auto: CPU cores
  train_gpu_memory_gb: 8                 # free GPU memory a training needs (uses ~3 GB; one of ours per GPU)
  sim_gpu_memory_gb: 4                   # free GPU memory a simulator job needs
  dataloader_workers: 16                 # data-loading processes per training

wandb:                                   # optional; results always go to <work_dir>/results (REPORT.md, JSON, CSV, figures)
  enabled: false                         # true: also log to W&B (needs `wandb login` and membership in the entity)
  entity: vig-dagger-exp
  project: plugcharger

hub:
  dataset_repo: chengenwu/PlugCharger-Hole4mm-SideCam-RandSocket-v1   # raw/planner: the 1000 demos the MoEs train on

# ---- part 1: planner demos
demos:
  source: download                       # download (hub.dataset_repo) | collect
  num_demos: 1000                        # the MoEs' training set ("base")

# ---- the MoE trainings (seeds 1 and 2; seed 0 is downloaded)
training:
  epochs: 60                             # 60 passes over the 1000 demos = 188,580 updates, as the seed-0 MoE

# ---- part 2: the MoEs that drive DAgger
moe:
  seeds: [0, 1, 2]
  factors: [1, 2, 4, 8, 16, 32, 64]      # resolution levels; VIG compares full resolution with the six degraded ones
  download:                              # seeds taken from Hugging Face instead of trained here
    sd0: chengenwu/sd0_plug_charger_hole4mm_sidecam_randsocket_vargrasp_1000mp_full_resmoe64_sd0

thresholds:                              # demo frames each MoE's score percentiles are computed on
  num_demos: 50
  frame_stride: 4

# ---- part 3: DAgger (one collection per MoE seed, scorer, threshold and variant)
dagger:
  scorers: [vig, flow]
  thresholds: [p90, p95, p99]            # percentiles of the MoE's own score on the demo frames; the SAME value for
                                         # taking over (above it) and handing back (below it)
  variants: [plain, random_move]         # random_move: a random gripper move at every takeover, before the expert
  num_demos: 500                         # successful DAgger episodes per collection
  take_count: 2                          # consecutive scores above the threshold before the expert takes over
  return_count: 16                       # consecutive scores below the threshold before the policy takes back
  expert: demo                           # the expert moves like the planner demos (and corrects in place near the socket)
  random_move:
    radius: 0.05                         # m: target uniform in a 5 cm ball around the gripper tip
    rot_deg: 5.0                         # deg: turned by 0-5 deg about a random axis
  max_episode_steps: 400
  seed_start: 1000000                    # every collection runs the same scene sequence from here
