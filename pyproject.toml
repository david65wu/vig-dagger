[project]
name = "vig-dagger"
version = "0.1.0"
description = "DAgger with VIG and flow-loss query scorers on Isaac Lab OpenDrawer, with the robopolicy flow-matching Transformer policies"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    # Policy training and inference (src/robopolicy).
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchcodec==0.9.1",
    "transformers>=4.56,<5",
    "pydantic>=2.12,<3",
    "typing-extensions>=4.12",
    "numpy==1.26.4",  # the NumPy of Isaac Sim 5.1 (the simulator jobs' environment, scripts/install_isaac.sh)
    "h5py>=3.11,<4",
    "wandb>=0.24,<0.25",
    # Pipeline, data transfer, analysis. The simulator (Isaac Sim, Isaac Lab) lives in a separate environment.
    "huggingface-hub>=0.34",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
vig-dagger = "vig_dagger.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"], include = ["robopolicy*", "vig_dagger*"]}}

[tool.setuptools.package-data]
robopolicy = ["py.typed"]
vig_dagger = ["configs/*.yaml", "configs/*.json", "opendrawer_env/assets/**/*"]

[tool.uv]
override-dependencies = ["numpy==1.26.4"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires a CUDA runtime", "video: requires both real video decoder extras", "vision: requires the vision extra"]
